<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Care Maternal — Patient Portal (DEMO)</title>
  <style>
    :root { --ink:#1f2933; --muted:#616e7c; --line:#d9e2ec; --bg:#f5f7fa; --brand:#0b6e4f; --warn:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header { background:var(--brand); color:#fff; padding:14px 16px; }
    header h1 { font-size:18px; margin:0; }
    .demo { background:#fff3cd; color:#664d03; padding:8px 16px; font-size:13px; border-bottom:1px solid #ffe69c; }
    main { max-width:560px; margin:0 auto; padding:16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
    label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
    input { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; }
    button { font-size:16px; padding:10px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; margin-top:10px; width:100%; }
    button.secondary { background:#52606d; }
    button:disabled { opacity:.5; cursor:default; }
    .msg { font-size:14px; margin-top:10px; min-height:18px; }
    .msg.err { color:var(--warn); }
    .row { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .row:last-child { border-bottom:0; }
    .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:#e4e7eb; white-space:nowrap; }
    .pill.due { background:#fde68a; } .pill.overdue { background:#fecaca; color:var(--warn); }
    .pill.done { background:#bbf7d0; } .pill.upcoming, .pill.waiting { background:#e4e7eb; }
    h2 { font-size:15px; margin:0 0 8px; }
  </style>
</head>
<body>
  <header><h1>Care Maternal — Patient Portal</h1></header>
  <div class="demo">DEMO ONLY. Synthetic patients. No real clinical information. Login code is sent to the server console.</div>
  <main>
    <section id="step-phone" class="card">
      <h2>1. Sign in with your phone number</h2>
      <label for="phone">Phone number</label>
      <input id="phone" value="+919999000001" inputmode="tel">
      <button id="send">Send login code</button>
      <div id="msg1" class="msg"></div>
    </section>

    <section id="step-code" class="card" hidden>
      <h2>2. Enter the code</h2>
      <label for="code">Login code</label>
      <input id="code" inputmode="numeric" maxlength="5" autocomplete="one-time-code">
      <button id="login">Sign in</button>
      <button id="back" class="secondary">Use a different number</button>
      <div id="msg2" class="msg"></div>
    </section>

    <section id="step-home" hidden>
      <div id="reminders" class="card" hidden><h2>Your reminders</h2><div id="reminder-list"></div></div>
      <div id="pregnancies"></div>
      <div id="alerts" class="card" hidden><h2>Messages from your clinic</h2><div id="alert-list"></div></div>
      <button id="signout" class="secondary">Sign out</button>
    </section>
  </main>

<script>
const API = "/api/v1/otp";
const MATERNAL = "/api/care_maternal/otp/pregnancies";
let token = null;               // kept in memory only; a reload signs the patient out
let phone = "";

const $ = (id) => document.getElementById(id);
function show(id, on) { $(id).hidden = !on; }
function setMsg(id, text, err) { const el = $(id); el.textContent = text; el.className = "msg" + (err ? " err" : ""); }

async function post(url, body, auth) {
  const headers = { "Content-Type": "application/json" };
  if (auth) headers["Authorization"] = "Bearer " + auth;
  const r = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(JSON.stringify(data.errors ? data.errors[0].msg : data));
  return data;
}
async function get(url) {
  const r = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
  if (!r.ok) throw new Error("Could not load your records (" + r.status + ")");
  return r.json();
}

$("send").onclick = async () => {
  phone = $("phone").value.trim();
  $("send").disabled = true;
  try {
    await post(API + "/send/", { phone_number: phone });
    // Demo only: writes the code to the server console (see viewsets/demo_sms.py).
    await post("/api/care_maternal/otp/demo-sms/", { phone_number: phone });
    show("step-phone", false); show("step-code", true);
    setMsg("msg2", "A login code was sent. Check the server console.");
  } catch (e) { setMsg("msg1", e.message, true); }
  finally { $("send").disabled = false; }
};

$("login").onclick = async () => {
  try {
    const data = await post(API + "/login/", { phone_number: phone, otp: $("code").value.trim() });
    token = data.access;
    show("step-code", false); show("step-home", true);
    await loadRecords();
  } catch (e) { setMsg("msg2", e.message, true); }
};

$("back").onclick = () => { show("step-code", false); show("step-phone", true); setMsg("msg1", ""); };
$("signout").onclick = () => { token = null; show("step-home", false); show("step-phone", true); };

function fmt(d) { return d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : ""; }

function row(text, pillText, pillClass) {
  const div = document.createElement("div"); div.className = "row";
  const span = document.createElement("span"); span.textContent = text;
  const pill = document.createElement("span"); pill.className = "pill " + (pillClass || ""); pill.textContent = pillText;
  div.append(span, pill); return div;
}

async function loadRecords() {
  const box = $("pregnancies"); box.replaceChildren();
  const list = await get(MATERNAL + "/");
  // Reminders: open items that are due or overdue, in plain words. Built from dates only.
  const due = [];
  for (const p of list) {
    for (const i of await get(MATERNAL + "/" + p.id + "/items/")) {
      if (i.state === "due" || i.state === "overdue") due.push(i);
    }
  }
  $("reminder-list").replaceChildren();
  for (const i of due.slice(0, 5)) {
    const text = i.state === "overdue"
      ? `${i.label}: was due by ${fmt(i.due_to)}. Please visit the clinic or call them.`
      : `${i.label}: due by ${fmt(i.due_to)}.`;
    const div = document.createElement("div"); div.className = "row"; div.textContent = text;
    $("reminder-list").append(div);
  }
  if (due.length === 0) {
    const div = document.createElement("div"); div.className = "row"; div.textContent = "Nothing due right now.";
    $("reminder-list").append(div);
  }
  show("reminders", true);
  if (!list.length) { box.append(Object.assign(document.createElement("p"), { textContent: "No pregnancy records for this number." })); }
  for (const p of list) {
    const card = document.createElement("div"); card.className = "card";
    const h = document.createElement("h2");
    h.textContent = `Pregnancy — ${p.gestational_age.weeks}+${p.gestational_age.days} weeks · due ${fmt(p.edd)}`;
    card.append(h);
    const items = await get(MATERNAL + "/" + p.id + "/items/");
    const pick = items.filter(i => ["overdue", "due", "upcoming"].includes(i.state) || i.state === "done").slice(0, 12);
    for (const i of pick) {
      const when = i.done_on ? "done " + fmt(i.done_on) : i.due_to ? "by " + fmt(i.due_to) : i.waiting_on || "";
      card.append(row(i.label, i.state, i.state));
      card.lastElementChild.querySelector("span").title = when;
    }
    box.append(card);
  }
  const alerts = [];
  for (const p of list) alerts.push(...await get(MATERNAL + "/" + p.id + "/alerts/"));
  $("alert-list").replaceChildren();
  for (const a of alerts) {
    const div = document.createElement("div"); div.className = "row";
    div.textContent = `${fmt(a.created_date.slice(0, 10))} — ${a.message}`;
    $("alert-list").append(div);
  }
  show("alerts", alerts.length > 0);
}
</script>
</body>
</html>
